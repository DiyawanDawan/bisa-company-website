# Netlify: NODE_ENV=production skips npm devDependencies.
# Keep TypeScript/Tailwind in dependencies; also install devDeps for lint tooling.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--include=dev"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Keep one canonical host (www) — avoids CORS/cookie quirks between apex and www.
[[redirects]]
  from = "https://bisaagri.com/*"
  to = "https://www.bisaagri.com/:splat"
  status = 301
  force = true
